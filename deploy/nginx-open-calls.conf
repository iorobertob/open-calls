# MISC open calls — mounted at __URL_PREFIX__/ on the WordPress site.
# Installed as /etc/nginx/snippets/misc-open-calls.conf and included INSIDE the existing
# `server { server_name misc.lmta.lt; ... }` block (deploy/remote-install.sh does this).
# `^~` makes these prefix locations win over WordPress's regex locations (\.php$, static-file caching).

location = __URL_PREFIX__ { return 301 __URL_PREFIX__/; }

location ^~ __URL_PREFIX__/static/ {
    alias __APP_DIR__/app/static/;
    expires 7d;
    access_log off;
}

location ^~ __URL_PREFIX__/ {
    # trailing slash strips the prefix: /open-calls/call/5 → http://127.0.0.1:PORT/call/5
    proxy_pass http://127.0.0.1:__APP_PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix __URL_PREFIX__;   # Flask builds all links under the prefix
    proxy_read_timeout 120s;      # "add by link" waits for the page fetch + Claude extraction
    client_max_body_size 5m;      # weekly list upload
}
