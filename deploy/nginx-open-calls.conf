# MISC open calls — mounted at __URL_PREFIX__/ on the WordPress site.
# Installed as /etc/nginx/snippets/misc-open-calls.conf and included INSIDE the HTTPS
# `server { server_name misc.lmta.lt; ... }` block, next to lmta-museum.conf (deploy/install.sh does this).
# `^~` makes these prefix locations win over the regex locations in that block
# (\.php$, the \.(js|css|png…)$ caching rule, ~ /booking(.*)), so they never capture /open-calls/.

location = __URL_PREFIX__ { return 301 __URL_PREFIX__/; }

location ^~ __URL_PREFIX__/static/ {
    alias __APP_DIR__/app/static/;
    expires 7d;
    access_log off;
}

location ^~ __URL_PREFIX__/ {
    # gunicorn unix socket; the ":/" strips the prefix: /open-calls/call/5 → /call/5
    proxy_pass http://unix:__SOCKET__:/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix __URL_PREFIX__;   # Flask builds all links under the prefix
    proxy_read_timeout 120s;      # "add by link" waits for the page fetch + Claude extraction
    client_max_body_size 5m;      # weekly list upload
}
