# /etc/nginx/sites-available/opencalls  (TLS via certbot --nginx)
server {
    listen 80;
    server_name opencalls.misc.lmta.lt;
    client_max_body_size 5m;

    location /static/ {
        alias /srv/opencalls/app/static/;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;   # "add by link" waits for the page fetch + Claude extraction
    }
}
