<title>MISC ekrano šablonas</title>
<style>
  /* ============================================================
     MISC — atviri kvietimai · ekranams (16:9, 4K)
     Piešiama fiksuotame 3840×2160 lauke ir automatiškai

  html,body{height:100%;background:#000;overflow:hidden;

  #stage{width:3840px;height:2160px;position:relative;transform-origin:center center;

  /* ---------- viršutinė juosta ---------- */
  #bar{height:250px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    gap:56px;padding:0 72px;border-bottom:3px solid rgba(255,255,255,.10);
    background:linear-gradient(180deg,#171d27,#12161e)}
  .logo{width:196px;height:196px;flex:none;display:block}
  #barmid{min-width:0}
  #sectionLt{font-size:72px;font-weight:700;letter-spacing:-.5px;line-height:1.02;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sectionEn{font-size:40px;font-weight:400;color:#9aa6bd;margin-top:6px;letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #barright{text-align:right;white-space:nowrap}
  #brandLine{font-size:34px;letter-spacing:8px;color:#8f9bb3;text-transform:uppercase}
  #nextUp{font-size:34px;font-weight:600;margin-top:12px;color:#c3cddf}
  #nextUp span{color:#6f7a90;font-weight:400}
  #dateLine{font-size:26px;color:#7b8699;margin-top:8px;letter-spacing:2px}

  /* ---------- tinklelis ---------- */
  #grid{position:absolute;top:250px;left:0;right:0;bottom:90px;
    display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:44px;padding:40px 72px;
    animation:pageIn .55s ease-out}
  @keyframes pageIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#grid{animation:none}}
  #grid.n1{grid-template-columns:1fr}
  #grid.n2{grid-auto-rows:1fr}

  /* ---------- kortelė ---------- */
  .card{background:#1b2230;border:2px solid rgba(255,255,255,.09);border-radius:34px;

  #grid.n2 .card{grid-template-columns:470px 1fr 410px}
  #grid.n1 .card{grid-template-columns:900px 1fr 600px}
  #grid.n1 h2{font-size:104px}
  #grid.n1 .titleEn{font-size:58px;margin-top:16px}
  #grid.n1 .place{font-size:52px;margin-top:36px}
  #grid.n1 .placeEn{font-size:40px}
  #grid.n1 .desc{font-size:48px;padding-top:44px;line-height:1.4}
  #grid.n1 .descEn{font-size:38px;margin-top:14px}
  #grid.n1 .kind{font-size:32px;padding:13px 26px;margin-bottom:34px}
  #grid.n1 .body{padding:64px 80px;justify-content:center}
  #grid.n1 .spacer{display:none}
  #grid.n1 .dlLabel{font-size:30px}
  #grid.n1 .dlLabelEn{font-size:25px}
  #grid.n1 .dlWord{font-size:34px}

  #grid.n1 .qrBox{margin:80px 0 0}
  #grid.n1 .scan{font-size:29px;margin-top:22px}

  .vis{position:relative;overflow:hidden;background:#0e131b}
  .vis svg{position:absolute;inset:-6%;width:112%;height:112%;
    animation:drift 46s ease-in-out infinite alternate}
  .vis:nth-of-type(odd) svg{animation-duration:58s;animation-direction:alternate-reverse}
  @keyframes drift{
    from{transform:scale(1) translate(0,0)}
    to  {transform:scale(1.07) translate(-1.5%, 1.8%)}
  }
  @media (prefers-reduced-motion:reduce){.vis svg{animation:none}}
  .visLabel{position:absolute;left:26px;bottom:22px;right:26px;font-size:24px;letter-spacing:6px;
    text-transform:uppercase;color:rgba(255,255,255,.62);z-index:2}

  .body{padding:36px 40px 30px;display:flex;flex-direction:column;min-width:0}
  .kind{display:inline-block;align-self:flex-start;font-size:23px;font-weight:700;letter-spacing:3px;
    text-transform:uppercase;padding:9px 18px;border-radius:10px;margin-bottom:20px}
  h2{font-size:60px;font-weight:700;line-height:1.05;letter-spacing:-.6px;
    overflow-wrap:anywhere;hyphens:auto}
  .titleEn{font-size:36px;font-weight:400;color:#9fabc2;line-height:1.16;margin-top:10px;
    overflow-wrap:anywhere}
  .place{margin-top:20px;font-size:33px;color:#c7d0e0;font-weight:600;line-height:1.25}
  .placeEn{font-size:27px;color:#828fa6;font-weight:400;margin-top:3px}
  .desc{padding-top:22px;font-size:27px;line-height:1.36;color:#b6c0d3}
  .descEn{font-size:24px;line-height:1.34;color:#7d889e;margin-top:8px}
  .spacer{flex:1;min-height:0}

  /* ---------- temų burbuliukai ---------- */
  .topics{display:flex;flex-wrap:wrap;gap:11px;margin-top:22px}
  .topic{font-size:23px;font-weight:600;line-height:1.15;padding:9px 20px;border-radius:999px;
    border:2px solid transparent;white-space:nowrap}
  .topic .en{font-weight:400;opacity:.72;margin-left:9px}
  /* konteksto / formato šeima — be spalvos, tik kontūras (skiriasi forma, ne tik atspalviu) */
  .topic.ctx{background:transparent;border-color:rgba(255,255,255,.28);color:#aab4c6}
  #grid.n1 .topics{gap:16px;margin-top:34px}
  #grid.n1 .topic{font-size:32px;padding:13px 28px}
  #grid.n2 .topic{font-size:25px}

  .side{border-left:2px solid rgba(255,255,255,.08);padding:32px 22px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:rgba(255,255,255,.025)}
  .dlLabel{font-size:22px;letter-spacing:4px;text-transform:uppercase;color:#8b97ad}
  .dlLabelEn{font-size:19px;letter-spacing:3px;text-transform:uppercase;color:#66718a;margin-top:2px}
  .dlDay{font-size:106px;font-weight:700;line-height:.95;margin-top:12px;letter-spacing:-4px}
  .dlMon{font-size:29px;font-weight:600;line-height:1.2;margin-top:8px;color:#d3dbe9}

  .dlWord{font-size:34px;font-weight:700;line-height:1.15;margin-top:14px}
  .soon{margin-top:16px;font-size:22px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
    padding:9px 18px;border-radius:9px;background:#4a1f1c;color:#ff9b91;line-height:1.25;
    white-space:nowrap}
  .soon span{display:block;font-size:17px;font-weight:600;letter-spacing:1.5px;opacity:.78}
  .card.urgent{border-color:rgba(230,103,103,.45)}
  .card.urgent .dlDay{color:#ff9b91}
  #grid.n1 .dlDay{font-size:170px}
  #grid.n1 .dlMon{font-size:44px}
  #grid.n1 .dlMonEn{font-size:36px}
  #grid.n1 .soon{font-size:28px;padding:12px 24px}
  .qrBox{margin-top:auto;background:#fff;border-radius:18px;padding:10px;width:306px;height:306px}
  #grid.n2 .qrBox{width:350px;height:350px;padding:12px}

  /* ---------- apatinė juosta ---------- */
  #foot{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;align-items:center;
    justify-content:space-between;padding:0 72px;font-size:27px;color:#8b96a9;letter-spacing:2px;

  #foot b{color:#dbe2ef;font-weight:600}
  #foot .en{color:#6b7688}
  #prog{position:absolute;left:0;bottom:0;height:6px;background:#6b8cff;width:0;transition:width .25s linear}

  /* ---------- patikros skydelis (klavišas V) ---------- */
  #checkBadge{position:absolute;right:26px;bottom:104px;z-index:40;display:none;
    background:#4a1f1c;color:#ffb3ab;border:2px solid #7a3a34;border-radius:12px;
    padding:12px 20px;font-size:24px;font-weight:600;letter-spacing:.5px}
  #checkPanel{position:absolute;inset:60px;z-index:50;display:none;overflow:auto;
    background:#0d1119f2;border:2px solid rgba(255,255,255,.16);border-radius:24px;padding:44px 52px}

  #checkPanel .err{color:#ff9b91}
  #checkPanel .warn{color:#e5bb5e}

  /* ---------- titulinis / legendos lapas ---------- */
  #cover{position:absolute;inset:250px 0 90px;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:60px 120px;
    animation:pageIn .55s ease-out}
  #cover.on{display:flex}
  #cover .clogo{width:520px;height:520px;margin-bottom:26px}
  #cover h1{font-size:96px;font-weight:700;letter-spacing:-1.5px;line-height:1.06}
  #cover .h1en{font-size:52px;font-weight:400;color:#9aa6bd;margin-top:14px}
  #cover .legendTitle{margin-top:64px;font-size:26px;letter-spacing:6px;text-transform:uppercase;

  #cover .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:24px}
  #cover .lg{display:flex;align-items:center;gap:16px;padding:16px 30px;border-radius:999px;

  /* užpildo kortelė, kai lape mažiau nei 4 kvietimai */

  .filler .logo{width:300px;height:300px}
  .filler .ftxt{font-size:40px;color:#8f9bb3;line-height:1.4;letter-spacing:2px}
  .filler .ftxt b{display:block;color:#dfe5f0;font-size:52px;font-weight:700;letter-spacing:0;margin-bottom:10px}

<script>
/* ================================================================
   1) QR kodų generatorius (savarankiškas, veikia be interneto)
   ================================================================ */
/* Minimal QR Code encoder — byte mode, ECC level M, versions 1-10.
   Returns a boolean matrix (true = dark). Self-contained, no dependencies. */
(function (root) {
  'use strict';

  // ---- GF(256) tables, primitive polynomial 0x11D ----
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11D;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();
  function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  // ---- per-version tables (index = version) for ECC level M ----
  var ECC_PER_BLOCK_M = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  var NUM_BLOCKS_M    = [0,  1,  1,  1,  2,  2,  4,  4,  4,  5,  5];

  function rawDataModules(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  function totalCodewords(ver) { return Math.floor(rawDataModules(ver) / 8); }
  function dataCodewords(ver) {
    return totalCodewords(ver) - ECC_PER_BLOCK_M[ver] * NUM_BLOCKS_M[ver];
  }

  function alignPositions(ver) {
    if (ver === 1) return [];
    var n = Math.floor(ver / 7) + 2;
    var step = Math.ceil((ver * 4 + 4) / (n - 1) / 2) * 2;
    var res = [6];
    for (var pos = ver * 4 + 10; res.length < n; pos -= step) res.splice(1, 0, pos);
    return res;
  }

  // ---- Reed-Solomon ----
  function rsGenerator(degree) {
    var poly = [1];
    for (var i = 0; i < degree; i++) {
      var next = new Array(poly.length + 1).fill(0);
      for (var j = 0; j < poly.length; j++) {
        next[j] ^= gmul(poly[j], 1);
        next[j + 1] ^= gmul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly; // length degree+1, leading coeff 1
  }
  function rsRemainder(data, degree) {
    var gen = rsGenerator(degree);
    var res = new Array(degree).fill(0);
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ res[0];
      res.shift(); res.push(0);
      for (var j = 0; j < degree; j++) res[j] ^= gmul(gen[j + 1], factor);
    }
    return res;
  }

  // ---- bit buffer ----
  function BitBuf() { this.bits = []; }
  BitBuf.prototype.put = function (val, len) {
    for (var i = len - 1; i >= 0; i--) this.bits.push((val >>> i) & 1);
  };

  function utf8Bytes(str) {
    var out = [], enc = encodeURIComponent(str);
    for (var i = 0; i < enc.length; i++) {
      if (enc[i] === '%') { out.push(parseInt(enc.substr(i + 1, 2), 16)); i += 2; }
      else out.push(enc.charCodeAt(i));
    }
    return out;
  }

  function chooseVersion(byteLen) {
    for (var v = 1; v <= 10; v++) {
      var headerBits = 4 + (v <= 9 ? 8 : 16);
      if (dataCodewords(v) * 8 >= headerBits + byteLen * 8) return v;
    }
    throw new Error('QR: data too long (max version 10 supported)');
  }

  function buildCodewords(bytes, ver) {
    var bb = new BitBuf();
    bb.put(4, 4);                                   // byte mode
    bb.put(bytes.length, ver <= 9 ? 8 : 16);        // character count
    for (var i = 0; i < bytes.length; i++) bb.put(bytes[i], 8);

    var capacity = dataCodewords(ver) * 8;
    for (var t = 0; t < 4 && bb.bits.length < capacity; t++) bb.bits.push(0);
    while (bb.bits.length % 8 !== 0) bb.bits.push(0);

    var dat = [];
    for (var b = 0; b < bb.bits.length; b += 8) {
      var v = 0;
      for (var k = 0; k < 8; k++) v = (v << 1) | bb.bits[b + k];
      dat.push(v);
    }
    var padBytes = [0xEC, 0x11], p = 0;
    while (dat.length < dataCodewords(ver)) dat.push(padBytes[p++ % 2]);

    // split into blocks and compute ECC
    var numBlocks = NUM_BLOCKS_M[ver], eccLen = ECC_PER_BLOCK_M[ver];
    var shortLen = Math.floor(dat.length / numBlocks);
    var numLong = dat.length % numBlocks;
    var blocks = [], eccs = [], off = 0;
    for (var bi = 0; bi < numBlocks; bi++) {
      var len = shortLen + (bi >= numBlocks - numLong ? 1 : 0);
      var blk = dat.slice(off, off + len); off += len;
      blocks.push(blk);
      eccs.push(rsRemainder(blk, eccLen));
    }
    // interleave
    var out = [], maxLen = shortLen + (numLong > 0 ? 1 : 0);
    for (var c = 0; c < maxLen; c++)
      for (var bj = 0; bj < numBlocks; bj++)
        if (c < blocks[bj].length) out.push(blocks[bj][c]);
    for (var e = 0; e < eccLen; e++)
      for (var bk = 0; bk < numBlocks; bk++) out.push(eccs[bk][e]);
    return out;
  }

  // ---- matrix construction ----
  function makeMatrix(ver, codewords) {
    var size = ver * 4 + 17;
    var m = [], reserved = [];
    for (var i = 0; i < size; i++) {
      m.push(new Array(size).fill(false));
      reserved.push(new Array(size).fill(false));
    }
    function setF(x, y, dark) {
      if (x < 0 || y < 0 || x >= size || y >= size) return;
      m[y][x] = dark; reserved[y][x] = true;
    }
    // finder patterns + separators
    function finder(cx, cy) {
      for (var dy = -4; dy <= 4; dy++)
        for (var dx = -4; dx <= 4; dx++) {
          var d = Math.max(Math.abs(dx), Math.abs(dy));
          setF(cx + dx, cy + dy, d !== 2 && d <= 3);
        }
    }
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

    // timing patterns
    for (var t = 0; t < size; t++) {
      if (!reserved[6][t]) setF(t, 6, t % 2 === 0);
      if (!reserved[t][6]) setF(6, t, t % 2 === 0);
    }
    // alignment patterns
    var ap = alignPositions(ver);
    for (var a = 0; a < ap.length; a++)
      for (var b = 0; b < ap.length; b++) {
        if ((a === 0 && b === 0) || (a === 0 && b === ap.length - 1) ||
            (a === ap.length - 1 && b === 0)) continue;
        for (var dy2 = -2; dy2 <= 2; dy2++)
          for (var dx2 = -2; dx2 <= 2; dx2++)
            setF(ap[b] + dx2, ap[a] + dy2, Math.max(Math.abs(dx2), Math.abs(dy2)) !== 1);
      }
    // reserve format info areas
    for (var f = 0; f < 9; f++) {
      if (!reserved[8][f]) { reserved[8][f] = true; }
      if (!reserved[f][8]) { reserved[f][8] = true; }
    }
    for (var g = 0; g < 8; g++) {
      reserved[8][size - 1 - g] = true;
      reserved[size - 1 - g][8] = true;
    }
    setF(8, size - 8, true); // dark module

    // version info (v >= 7)
    if (ver >= 7) {
      var rem = ver;
      for (var q = 0; q < 12; q++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      var vbits = (ver << 12) | rem;
      for (var k = 0; k < 18; k++) {
        var bit = ((vbits >>> k) & 1) === 1;
        var r = Math.floor(k / 3), cc = k % 3;
        setF(size - 11 + cc, r, bit);
        setF(r, size - 11 + cc, bit);
      }
    }

    // place data bits, zigzag from bottom-right
    var bitIdx = 0;
    function nextBit() {
      if (bitIdx >= codewords.length * 8) return false;
      var v = (codewords[bitIdx >>> 3] >>> (7 - (bitIdx & 7))) & 1;
      bitIdx++;
      return v === 1;
    }
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < size; vert++) {
        for (var j2 = 0; j2 < 2; j2++) {
          var x = right - j2;
          var upward = ((right + 1) & 2) === 0;
          var y = upward ? size - 1 - vert : vert;
          if (!reserved[y][x]) m[y][x] = nextBit();
        }
      }
    }
    return { m: m, reserved: reserved, size: size };
  }

  function applyMask(m, reserved, size, mask) {
    var out = m.map(function (row) { return row.slice(); });
    for (var y = 0; y < size; y++)
      for (var x = 0; x < size; x++) {
        if (reserved[y][x]) continue;
        var inv;
        switch (mask) {
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0; break;

function relLum(hex){
  var c=[1,3,5].map(function(i){var v=parseInt(hex.substr(i,2),16)/255;
    return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function inkOn(hex){
  var L=relLum(hex), Ld=relLum('#12161e');
  var vsWhite=1.05/(L+0.05), vsDark=(L+0.05)/(Ld+0.05);
  return vsWhite>=vsDark ? '#ffffff' : '#12161e';
}

function hashSeed(s){var h=1779033703^s.length;
  for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);
    return((h^=h>>>16)>>>0)/4294967296;};}

function visualFor(call){
  var kind = KINDS[call.kind] || KINDS.competition;
  var seedStr = (call.titleEn||'')+'|'+(call.cityEn||'')+'|'+(call.countryEn||'')+'|'+call.kind+
                '|'+(call.descEn||'').slice(0,40);
  var r = hashSeed(seedStr);
  var W=400,H=820;
  /* atspalvis svyruoja apie tipo bazinę reikšmę — tipas atpažįstamas, bet kiekvienas kvietimas savitas */
  var hue = (kind.hue + Math.round((r()-0.5)*46) + 360) % 360;
  var hue2 = (hue + (r()<0.5?-22:22) + 360) % 360;
  var uid = 'v'+Math.floor(r()*1e9).toString(36);
  var sat = 52+Math.round(r()*22), lum = 54+Math.round(r()*16);
  var c1='hsl('+hue+' '+sat+'% '+lum+'%)', c2='hsl('+hue2+' '+(sat-8)+'% '+(lum-16)+'%)';
  var p=[];
  p.push('<defs><linearGradient id="'+uid+'" x1="'+r().toFixed(2)+'" y1="0" x2="'+r().toFixed(2)+'" y2="1">'+
         '<stop offset="0" stop-color="hsl('+hue+' 32% '+(12+Math.round(r()*8))+'%)"/>'+
         '<stop offset="1" stop-color="hsl('+hue2+' 40% 7%)"/></linearGradient>'+
         '<radialGradient id="'+uid+'a" cx="50%" cy="42%" r="62%">'+
         '<stop offset="0" stop-color="'+c1+'" stop-opacity="'+(0.10+r()*0.14).toFixed(2)+'"/>'+
         '<stop offset="1" stop-color="'+c1+'" stop-opacity="0"/></radialGradient></defs>');
  p.push('<rect width="'+W+'" height="'+H+'" fill="url(#'+uid+')"/>');
  p.push('<rect width="'+W+'" height="'+H+'" fill="url(#'+uid+'a)"/>');
  /* MISC firminės brūkšnelių eilutės — bendras visų vizualų vardiklis */
  var dashRows = 3+Math.floor(r()*4), dashTop = r()<0.5 ? 40 : H-260;
  for(var dr=0;dr<dashRows;dr++){
    var dy0 = dashTop + dr*(26+r()*16);
    p.push('<rect x="'+(20+r()*90).toFixed(1)+'" y="'+dy0.toFixed(1)+'" width="'+
      (40+r()*210).toFixed(1)+'" height="6" rx="3" fill="#fff" opacity="'+(0.07+r()*0.16).toFixed(2)+'"/>');
  }
  var cx=W*(0.34+r()*0.32), cy=H*(0.30+r()*0.28), i, j, n;

  if(kind.motif==='burst'){
    n=16+Math.floor(r()*22);
    var inner=14+r()*44, spread=(0.55+r()*0.45);
    for(i=0;i<n;i++){var a=(i/n)*Math.PI*2*spread + r()*0.3 + r()*6.28*(spread<1?1:0);
      var len=inner+50+r()*(150+r()*180);
      p.push('<line x1="'+(cx+Math.cos(a)*inner).toFixed(1)+'" y1="'+(cy+Math.sin(a)*inner).toFixed(1)+
             '" x2="'+(cx+Math.cos(a)*len).toFixed(1)+
             '" y2="'+(cy+Math.sin(a)*len).toFixed(1)+'" stroke="'+(i%3?c1:c2)+
             '" stroke-width="'+(1.5+r()*8).toFixed(1)+'" opacity="'+(0.22+r()*0.55).toFixed(2)+'"/>');}
    var rings=1+Math.floor(r()*3);
    for(i=0;i<rings;i++)
      p.push('<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(inner+30+i*(24+r()*40)).toFixed(1)+
             '" fill="none" stroke="'+c1+'" stroke-width="'+(1+r()*3).toFixed(1)+
             '" opacity="'+(0.18+r()*0.3).toFixed(2)+'"/>');
    p.push('<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(inner*0.8).toFixed(1)+
           '" fill="'+c1+'" opacity=".92"/>');
  } else if(kind.motif==='waves'){
    n=13+Math.floor(r()*9);
    for(i=0;i<n;i++){var y=H*0.14+i*(H*0.72/n), amp=16+r()*54, d='M0 '+y.toFixed(1);
      for(j=1;j<=8;j++){var x=W*j/8, yy=y+Math.sin(j*1.1+i*0.7+r())*amp;
        d+=' Q'+(x-W/16).toFixed(1)+' '+yy.toFixed(1)+' '+x.toFixed(1)+' '+(y+Math.sin(j+i)*amp*0.5).toFixed(1);}
      p.push('<path d="'+d+'" fill="none" stroke="'+(i%3?c1:c2)+'" stroke-width="'+
             (1.6+r()*5).toFixed(1)+'" opacity="'+(0.22+r()*0.55).toFixed(2)+'"/>');}
  } else if(kind.motif==='bands'){
    var R=98+r()*54;
    p.push('<clipPath id="'+uid+'c"><circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+R.toFixed(1)+'"/></clipPath>');
    p.push('<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+R.toFixed(1)+'" fill="'+c1+'" opacity=".92"/>');
    n=6+Math.floor(r()*8);
    for(i=0;i<n;i++){var by=cy-R+ i*(2*R/n)+ (r()*7);
      p.push('<rect clip-path="url(#'+uid+'c)" x="'+(cx-R).toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+(2*R).toFixed(1)+
             '" height="'+(4+r()*13).toFixed(1)+'" fill="hsl('+hue+' 34% 11%)" opacity=".88"/>');}
    var rows=5+Math.floor(r()*5);
    for(i=0;i<rows;i++){var ly=cy+R+34+i*(26+r()*18);
      p.push('<rect x="'+(cx-(20+r()*150)).toFixed(1)+'" y="'+ly.toFixed(1)+'" width="'+
             (50+r()*230).toFixed(1)+'" height="7" rx="3.5" fill="'+c2+'" opacity="'+(0.28+r()*0.5).toFixed(2)+'"/>');}
  } else if(kind.motif==='network'){
    var pts=[], m=13+Math.floor(r()*10);
    for(i=0;i<m;i++)pts.push([40+r()*(W-80), 60+r()*(H-120)]);
    for(i=0;i<pts.length;i++)for(j=i+1;j<pts.length;j++){
      var dx=pts[i][0]-pts[j][0], dy=pts[i][1]-pts[j][1], dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<175)p.push('<line x1="'+pts[i][0].toFixed(1)+'" y1="'+pts[i][1].toFixed(1)+'" x2="'+
        pts[j][0].toFixed(1)+'" y2="'+pts[j][1].toFixed(1)+'" stroke="'+c1+
        '" stroke-width="1.6" opacity="'+(0.5-dist/420).toFixed(2)+'"/>');}
    for(i=0;i<pts.length;i++)p.push('<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+
      '" r="'+(4+r()*11).toFixed(1)+'" fill="'+(i%4?c1:c2)+'" opacity="'+(0.55+r()*0.4).toFixed(2)+'"/>');
  } else if(kind.motif==='orbit'){
    n=6+Math.floor(r()*8);
    var baseAng=r()*180, tilt=0.24+r()*0.6;
    for(i=0;i<n;i++){var rr=30+i*(190/n)+r()*26, ang=baseAng+(r()-0.5)*46;
      p.push('<ellipse cx="'+(cx+(r()-0.5)*46).toFixed(1)+'" cy="'+(cy+(r()-0.5)*46).toFixed(1)+
        '" rx="'+rr.toFixed(1)+'" ry="'+(rr*tilt).toFixed(1)+'" transform="rotate('+
        ang.toFixed(1)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')" fill="none" stroke="'+(i%2?c1:c2)+
        '" stroke-width="'+(1.6+r()*4.5).toFixed(1)+'" opacity="'+(0.28+r()*0.5).toFixed(2)+'"/>');}
    for(i=0;i<3+Math.floor(r()*4);i++){var oa=r()*6.28, orr=50+r()*180;
      p.push('<circle cx="'+(cx+Math.cos(oa)*orr).toFixed(1)+'" cy="'+(cy+Math.sin(oa)*orr*tilt).toFixed(1)+
        '" r="'+(3+r()*9).toFixed(1)+'" fill="'+c1+'" opacity=".8"/>');}
    p.push('<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(13+r()*18).toFixed(1)+'" fill="#fff" opacity=".85"/>');
  } else { /* field */
    n=100+Math.floor(r()*70);
    for(i=0;i<n;i++){var fx=r()*W, fy=r()*H, s=1.5+r()*7;
      p.push('<circle cx="'+fx.toFixed(1)+'" cy="'+fy.toFixed(1)+'" r="'+s.toFixed(1)+
             '" fill="'+(i%5?c1:c2)+'" opacity="'+(0.15+r()*0.6).toFixed(2)+'"/>');}
    for(i=0;i<5;i++){var ay=120+i*140+r()*40;
      p.push('<path d="M30 '+ay.toFixed(1)+' Q'+(W/2)+' '+(ay-70-r()*60).toFixed(1)+' '+(W-30)+' '+
             ay.toFixed(1)+'" fill="none" stroke="'+c2+'" stroke-width="'+(2+r()*4).toFixed(1)+
             '" opacity="'+(0.3+r()*0.4).toFixed(2)+'"/>');}
  }
  /* šalies kodas fone */
  var cc=(call.countryCode||'').toUpperCase();
  if(cc)p.push('<text x="'+(W-26)+'" y="'+(H-104)+'" text-anchor="end" font-size="132" font-weight="700"'+
    ' fill="#fff" opacity=".09" font-family="inherit">'+esc(cc)+'</text>');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+p.join('')+'</svg>';
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function hostOf(u){
  try{return String(u).replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];}
  catch(e){return '';}
}

function qrSvg(url){
  try{
    var q = MiscQR.svgPath(url, 3);
    return '<svg viewBox="0 0 '+q.extent+' '+q.extent+'" shape-rendering="crispEdges">'+
           '<rect width="'+q.extent+'" height="'+q.extent+'" fill="#fff"/>'+
           '<path d="'+q.d+'" fill="#000"/></svg>';
  }catch(e){
    return '<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#fff"/>'+
           '<text x="5" y="5.6" font-size="1.6" text-anchor="middle" fill="#900">QR?</text></svg>';
  }
}

    var fam=TOPIC_FAMILIES[t.f]||TOPIC_FAMILIES.ctx;
    if(!fam.color) return '<span class="topic ctx">'+esc(t.lt)+'<span class="en">'+esc(t.en)+'</span></span>';
    /* pilnai užpildytas burbuliukas — spalva neša šeimą, tekstas visada kontrastingas */
    return '<span class="topic" style="background:'+fam.color+';border-color:'+fam.color+';color:'+
           inkOn(fam.color)+'">'+esc(t.lt)+'<span class="en">'+esc(t.en)+'</span></span>';
  }).filter(Boolean).join('');
  return list ? '<div class="topics">'+list+'</div>' : '';
}

/* kiek dienų iki termino — naudojama TIK „skubu“ žymai, skaičius nerodomas */
function daysLeft(c){
  if(!c.deadline) return null;
  var p=c.deadline.split('-');
  var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  var now=CONFIG.today?new Date(CONFIG.today+'T00:00:00Z'):new Date();
  return Math.round((d-Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()))/864e5);
}

function cardHtml(c){
  var k = KINDS[c.kind]||KINDS.competition, dl=fmtDeadline(c);
  var kindStyle='background:hsl('+k.hue+' 55% 20%);color:hsl('+k.hue+' 75% 74%)';
  var dleft=daysLeft(c);
  var urgent = CONFIG.markUrgent && dleft!==null && dleft>=0 && dleft<=CONFIG.urgentDays;
  return '<div class="card'+(urgent?' urgent':'')+'">'+
    '<div class="vis">'+visualFor(c)+
      '<div class="visLabel">'+esc(c.cityEn||'')+'</div></div>'+
    '<div class="body">'+
      '<span class="kind" style="'+kindStyle+'">'+esc(k.shortLt)+' · '+esc(k.shortEn)+'</span>'+
      '<h2>'+esc(c.titleLt)+'</h2>'+
      (c.titleEn&&c.titleEn!==c.titleLt?'<div class="titleEn">'+esc(c.titleEn)+'</div>':'')+
      '<div class="place">'+esc(c.cityLt)+', '+esc(c.countryLt)+
        '<div class="placeEn">'+esc(c.cityEn)+', '+esc(c.countryEn)+'</div></div>'+
      topicsHtml(c)+
      '<div class="desc">'+esc(c.descLt)+
        '<div class="descEn">'+esc(c.descEn)+'</div></div>'+
      '<div class="spacer"></div>'+
    '</div>'+
    '<div class="side">'+
      '<div class="dlLabel">Terminas</div><div class="dlLabelEn">Deadline</div>'+
      (dl.big?'<div class="dlDay">'+esc(dl.day)+'</div>'+
              '<div class="dlMon">'+esc(dl.monLt)+'</div>'+
              '<div class="dlMonEn">'+esc(dl.monEn)+'</div>'
             :'<div class="dlWord">'+esc(dl.wordLt)+'<br><span style="color:#9aa6bd;font-weight:400">'+
              esc(dl.wordEn)+'</span></div>')+
      (urgent?'<div class="soon">Skubu<span>Closing soon</span></div>':'')+
      '<div class="qrBox">'+qrSvg(c.url)+'</div>'+
      '<div class="scan"><b>Skenuok</b>Scan for details</div>'+
      '<div class="host">'+esc(hostOf(c.url))+'</div>'+
    '</div>'+
  '</div>';
}

function fillerHtml(){
  return '<div class="card filler">'+MISC_LOGO+
    '<div class="ftxt"><b>Daugiau kvietimų</b>More open calls<br>misc.lmta.lt</div></div>';
}

/* ================================================================
   6b) PATIKRA — ar duomenys sukelti teisingai
   Spauskite V, kad pamatytumėte visas pastabas. Skydelis niekada
   nerodomas automatiškai per visą ekraną, tad televizoriuje netrukdo.
   ================================================================ */
function checkData(){
  var REQ=['kind','titleLt','titleEn','cityLt','cityEn','countryLt','countryEn',
           'countryCode','descLt','descEn','url'];
  var out=[];
  CALLS.forEach(function(c,i){
    var name=c.titleLt||c.titleEn||('#'+(i+1)), errs=[], warns=[];
    REQ.forEach(function(f){ if(!c[f]||!String(c[f]).trim()) errs.push('trūksta lauko „'+f+'“'); });
    if(c.kind && !KINDS[c.kind]) errs.push('nežinomas tipas „'+c.kind+'“ (galimi: '+Object.keys(KINDS).join(', ')+')');
    if(c.deadline){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(c.deadline)) errs.push('terminas turi būti MMMM-MM-DD, o ne „'+c.deadline+'“');
      else{
        var p=c.deadline.split('-'), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
        if(d.getUTCMonth()!==+p[1]-1||d.getUTCDate()!==+p[2]) errs.push('tokios datos nėra: '+c.deadline);
        else{ var dl=daysLeft(c); if(dl!==null&&dl<0) warns.push('terminas jau praėjo'); }
      }
    } else if(!c.deadlineWordLt||!c.deadlineWordEn){
      errs.push('be termino datos būtini „deadlineWordLt“ ir „deadlineWordEn“');
    }
    if(c.countryCode && !/^[A-Z]{2}$/.test(c.countryCode))
      warns.push('šalies kodas turėtų būti dvi didžiosios raidės, dabar „'+c.countryCode+'“');
    if(c.url && !/^https?:\/\//.test(c.url)) errs.push('nuoroda turi prasidėti http:// arba https://');
    var t=c.topics||[];
    if(!t.length) warns.push('nėra nė vieno temos burbuliuko');
    if(t.length>4) warns.push('daugiau nei 4 temos — netilps gražiai');
    t.forEach(function(k){ if(!TOPICS[k]) errs.push('nežinoma tema „'+k+'“'); });
    if((c.titleLt||'').length>78) warns.push('lietuviškas pavadinimas ilgas ('+c.titleLt.length+' simb.) — gali užimti tris eilutes');
    if((c.descLt||'').length>165) warns.push('lietuviškas aprašymas ilgas ('+c.descLt.length+' simb.)');
    if((c.descEn||'').length>165) warns.push('angliškas aprašymas ilgas ('+c.descEn.length+' simb.)');
    if(errs.length||warns.length) out.push({name:name, errs:errs, warns:warns});
  });
  return out;
}

function renderChecks(){
  var res=checkData(), panel=document.getElementById('checkPanel'), badge=document.getElementById('checkBadge');
  var nErr=res.reduce(function(a,r){return a+r.errs.length;},0);
  var nWarn=res.reduce(function(a,r){return a+r.warns.length;},0);
  if(!res.length){
    panel.innerHTML='<h3>Duomenų patikra</h3><div class="sub">'+CALLS.length+
      ' kvietimai · klavišas V uždaro šį langą</div><div class="ok">Viskas tvarkoje — klaidų nerasta.</div>';
  }else{
    panel.innerHTML='<h3>Duomenų patikra</h3><div class="sub">'+CALLS.length+' kvietimai · '+
      nErr+' klaidos, '+nWarn+' pastabos · klavišas V uždaro šį langą</div><ul>'+
      res.map(function(r){
        return '<li><span class="who">'+esc(r.name)+'</span><br>'+
          r.errs.map(function(e){return '<span class="err">✗ '+esc(e)+'</span>';}).join('<br>')+
          (r.errs.length&&r.warns.length?'<br>':'')+
          r.warns.map(function(w){return '<span class="warn">! '+esc(w)+'</span>';}).join('<br>')+
        '</li>';
      }).join('')+'</ul>';
  }
  if(CONFIG.checkBadge && res.length){
    badge.textContent = nErr ? ('Patikra: '+nErr+' klaidos, '+nWarn+' pastabos — spauskite V')
                             : ('Patikra: '+nWarn+' pastabos — spauskite V');
    badge.className='on';
  }
  if(typeof console!=='undefined')
    console.log('[MISC] patikra:', CALLS.length, 'kvietimai,', nErr, 'klaidos,', nWarn, 'pastabos');
}

function coverHtml(){
  var lg=Object.keys(TOPIC_FAMILIES).map(function(key){
    var f=TOPIC_FAMILIES[key];
    var sw=f.color?'<i class="sw" style="background:'+f.color+'"></i>':'<i class="sw out"></i>';
    return '<div class="lg">'+sw+'<div class="lgt">'+esc(f.lt)+'<span>'+esc(f.en)+'</span></div></div>';
  }).join('');
  return MISC_LOGO.replace('class="logo"','class="logo clogo"')+
    '<h1>Atviri kvietimai studentams</h1>'+
    '<div class="h1en">Open calls for students</div>'+
    '<div class="legendTitle">Temų spalvos · Topic colours</div>'+
    '<div class="legend">'+lg+'</div>';
}

/* lapų sudarymas: grupuojama pagal tipą, po CONFIG.perPage viename lape */
function buildPages(){
  var pages=[], order=KIND_ORDER.slice();
  Object.keys(KINDS).forEach(function(k){if(order.indexOf(k)<0)order.push(k);});
  order.forEach(function(kind){
    var list=CALLS.filter(function(c){return c.kind===kind;});
    if(!list.length)return;
    list.sort(function(a,b){return (a.deadline||'9999').localeCompare(b.deadline||'9999');});
    for(var i=0;i<list.length;i+=CONFIG.perPage)
      pages.push({kind:kind, items:list.slice(i,i+CONFIG.perPage)});
  });
  if(CONFIG.showCover && pages.length) pages.unshift({cover:true, kind:pages[0].kind, items:[]});
  return pages;
}

var PAGES=buildPages(), idx=0, timer=null, tick=null;

function render(){
  if(!PAGES.length)return;
  var pg=PAGES[idx], k=KINDS[pg.kind]||KINDS.competition;
  document.getElementById('logoSlot').innerHTML=MISC_LOGO;
  document.getElementById('sectionLt').textContent=pg.cover?'LMTA · Muzikos inovacijų studijų centras':k.lt;
  document.getElementById('sectionEn').textContent=pg.cover?'Music Innovation Studies Centre':k.en;
  /* „Toliau“ rodo tik KITĄ kategoriją — nekartoja tos pačios, jei ji tęsiasi per kelis lapus */
  var nk=null;
  for(var s=1;s<PAGES.length;s++){
    var cand=PAGES[(idx+s)%PAGES.length];
    if(cand.cover) continue;
    if(pg.cover || cand.kind!==pg.kind){nk=KINDS[cand.kind];break;}
  }
  document.getElementById('nextUp').innerHTML=
    nk ? 'Toliau: '+esc(nk.lt)+' <span>· Next: '+esc(nk.en)+'</span>' : '';
  document.getElementById('dateLine').textContent=CONFIG.updatedLt+'  ·  '+CONFIG.updatedEn;
  document.getElementById('footLeft').innerHTML=
    '<b>Sąrašas atnaujinamas kiekvieną pirmadienį — sekite naujienas</b>'+
    '<span class="en">&nbsp;&nbsp;·&nbsp;&nbsp;Updated every Monday — stay tuned</span>';
  document.getElementById('footRight').innerHTML=
    'misc.lmta.lt&nbsp;&nbsp;·&nbsp;&nbsp;<span class="en">Skenuokite QR kodą telefonu · Scan the QR code</span>';
  var g=document.getElementById('grid'), cv=document.getElementById('cover'), n=pg.items.length;
  if(pg.cover){
    g.style.display='none'; cv.className='on'; cv.innerHTML=coverHtml();
    cv.style.animation='none'; void cv.offsetWidth; cv.style.animation='';
    return;
  }
  cv.className=''; g.style.display='';
  g.className = n<4 ? ('n'+n) : '';
  g.innerHTML=pg.items.map(cardHtml).join('');
  g.style.animation='none'; void g.offsetWidth; g.style.animation='';
}

function go(d){idx=(idx+d+PAGES.length)%PAGES.length;render();restart();}
function restart(){
  clearInterval(timer);clearInterval(tick);
  var bar=document.getElementById('prog');bar.style.width='0%';
  if(!CONFIG.autoplay||PAGES.length<2)return;
  var t0=Date.now(), ms=CONFIG.slideSeconds*1000;
  tick=setInterval(function(){bar.style.width=Math.min(100,(Date.now()-t0)/ms*100)+'%';},240);
  timer=setInterval(function(){go(1);},ms);
}
function fit(){
  var s=Math.min(window.innerWidth/3840, window.innerHeight/2160);
  document.getElementById('stage').style.transform='scale('+s+')';
}
window.addEventListener('resize',fit);
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key.toLowerCase()==='p'){CONFIG.autoplay=!CONFIG.autoplay;restart();}
  else if(e.key.toLowerCase()==='v'){
    var pn=document.getElementById('checkPanel');
    pn.className = pn.className==='on' ? '' : 'on';
    document.getElementById('checkBadge').className='';
    e.stopPropagation();
  }
});
document.addEventListener('click',function(e){
  if(document.getElementById('checkPanel').className==='on'){
    document.getElementById('checkPanel').className=''; return;
  }
  go(1);
});
fit();render();restart();renderChecks();
</script>
